{% extends "base.html" %}

{% block extra_head %}
<script src="{{ url_for('static', filename='js/dziekanat/zal9_lista.js') }}"></script>
{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('dziekanat.dashboard') }}" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Wróć do Panelu Głównego
    </a>
    <h2 style="color: #495057; font-weight: normal; font-size: 1.5rem; text-transform: uppercase;">
        <i class="bi bi-clipboard-check text-primary"></i> Weryfikacja Oświadczeń (Zał. 9)
    </h2>
</div>

<!-- Tabs navs -->
<ul class="nav nav-tabs mb-3" id="zal9Tabs" role="tablist">
  <li class="nav-item" role="presentation">
    <button class="nav-link active fw-bold" id="weryfikacja-tab" data-bs-toggle="tab" data-bs-target="#weryfikacja" type="button" role="tab" aria-controls="weryfikacja" aria-selected="true">
        Do weryfikacji 
        <span class="badge bg-danger ms-1" id="do-weryfikacji-badge" style="display: none;">0</span>
    </button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link text-muted" id="historia-tab" data-bs-toggle="tab" data-bs-target="#historia" type="button" role="tab" aria-controls="historia" aria-selected="false">
        Historia (Zatwierdzone)
    </button>
  </li>
</ul>

<!-- Tabs content -->
<div class="tab-content" id="zal9TabsContent">
  <!-- Zakładka: Do weryfikacji -->
  <div class="tab-pane fade show active" id="weryfikacja" role="tabpanel" aria-labelledby="weryfikacja-tab">
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Student</th>
                            <th>Data złożenia</th>
                            <th class="text-center">Akcje</th>
                        </tr>
                    </thead>
                    <tbody id="do-weryfikacji-table">
                        <tr><td colspan="3" class="text-center">Ładowanie...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
  </div>

  <!-- Zakładka: Historia -->
  <div class="tab-pane fade" id="historia" role="tabpanel" aria-labelledby="historia-tab">
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Student</th>
                            <th>Data zatwierdzenia</th>
                            <th class="text-center">Status</th>
                            <th class="text-center">Akcje</th>
                        </tr>
                    </thead>
                    <tbody id="zatwierdzone-table">
                        <tr><td colspan="4" class="text-center">Ładowanie...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
  </div>
</div>
{% endblock %}

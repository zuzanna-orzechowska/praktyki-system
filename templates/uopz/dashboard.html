{% extends "base.html" %}

{% block extra_head %}
<script src="{{ url_for('static', filename='js/uopz/dashboard.js') }}"></script>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 style="color: #495057; font-weight: normal; font-size: 1.5rem; text-transform: uppercase; margin-bottom: 0;">
        Panel Opiekuna Uczelnianego</h2>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-white fw-bold py-3">
        <i class="bi bi-people-fill me-2 text-primary"></i> Moi Studenci (Praktyki)
    </div>
    <div class="card-body p-0">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th class="ps-4">Student</th>
                    <th>Nr albumu</th>
                    <th>Kierunek</th>
                    <th>Termin praktyki</th>
                    <th>Status Praktyki</th>
                    <th class="text-end pe-4">Akcje</th>
                </tr>
            </thead>
            <tbody id="praktyki-table">
                <tr><td colspan="6" class="text-center py-4">Ładowanie...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

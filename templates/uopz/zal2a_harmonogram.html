{% extends "base.html" %}

{% block extra_head %}
<script src="{{ url_for('static', filename='js/uopz/zal2a_harmonogram.js') }}"></script>
{% endblock %}

{% block content %}
<div class="mb-4">
    <a id="back-link" href="#" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Wróć do teczki
    </a>
    <h2 style="color: #495057; font-weight: normal; font-size: 1.5rem; text-transform: uppercase;">
        Harmonogram i Program Praktyki (Zał. 2a) - UOPZ
    </h2>
    <p class="text-muted" id="student-name">Ładowanie...</p>
</div>

<div id="alerts-container"></div>

<div class="card shadow-sm border-0 mb-4 bg-light">
    <div class="card-body">
        <form id="form-harmonogram">
            <h5 class="fw-bold mb-3">Program Praktyki (Prace i efekty)</h5>
            <div id="programy-container" class="mb-4">
                <p>Ładowanie...</p>
            </div>

            <h5 class="fw-bold mb-3">Harmonogram Praktyki</h5>
            <table class="table table-bordered bg-white" id="tabela-harmonogram">
                <thead class="table-light">
                    <tr>
                        <th>Lp.</th>
                        <th>Nazwa działu / komórki</th>
                        <th>Liczba dni</th>
                        <th><button type="button" class="btn btn-sm btn-outline-primary" id="btn-add-row"><i class="bi bi-plus"></i> Dodaj</button></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows generated by JS -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="2" class="text-end fw-bold">Razem:</td>
                        <td class="fw-bold" id="total-days">0</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>

            <button type="submit" class="btn btn-primary mt-3">Zapisz i Wyślij do studenta</button>
        </form>
    </div>
</div>
{% endblock %}

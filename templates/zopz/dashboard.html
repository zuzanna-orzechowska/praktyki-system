{% extends "base.html" %}

{% block extra_head %}
<script src="{{ url_for('static', filename='js/zopz/dashboard.js') }}"></script>
{% endblock %}

{% block content %}
<h2 class="mb-4" style="color: #495057; font-weight: normal; font-size: 1.5rem; text-transform: uppercase;">
    <i class="bi bi-building text-primary"></i> Panel Opiekuna Zakładowego
</h2>

<div id="zaklad-container" style="display: none;">
    <div class="card shadow-sm border-0 mb-4 bg-light border-start border-primary border-4">
        <div class="card-body">
            <h5 class="mb-1 text-primary" id="zaklad-nazwa"></h5>
            <p class="mb-0 text-muted"><i class="bi bi-geo-alt-fill"></i> <span id="zaklad-adres"></span></p>
        </div>
    </div>
</div>

<div id="zaklad-warning" style="display: none;">
    <div class="alert alert-warning shadow-sm">
        <i class="bi bi-exclamation-triangle-fill"></i> Nie masz jeszcze przypisanej firmy w systemie. Skontaktuj się z Dziekanatem.
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-white fw-bold py-3">
        <i class="bi bi-people-fill text-primary me-2"></i> Przypisani Praktykanci
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Student</th>
                        <th>Kierunek</th>
                        <th>Termin praktyki</th>
                        <th>Status</th>
                        <th class="text-center">Akcje</th>
                    </tr>
                </thead>
                <tbody id="praktykanci-table">
                    <tr><td colspan="5" class="text-center py-5">Ładowanie...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
